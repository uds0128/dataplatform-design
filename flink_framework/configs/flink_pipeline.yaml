extractor:
  class: "flink_framework.extractors.kafka_extractor.KafkaExtractor"
  topic: "raw-transactions"
  bootstrap_servers: "localhost:9092"
  schema:
    id: "STRING"
    name: "STRING"
    amount: "DOUBLE"
    updated_at: "TIMESTAMP(3)"

transformer:
  class: "flink_framework.transformers.sql_transformer.SQLTransformer"
  columns:
    id: "id"
    full_name: "CONCAT('Prefix_', name)"
    amount: "amount"
    updated_at: "updated_at"

data_quality:
  class: "flink_framework.dq.sql_rule_dq.SQLRuleDQGate"
  rules:
    amount_positive: "amount >= 0"
    name_not_null: "name IS NOT NULL"

sink:
  class: "flink_framework.sinks.iceberg_sink.IcebergSink"
  table_name: "silver_zone.transactions"
  primary_key: ["id"]
  schema:
    id: "STRING"
    full_name: "STRING"
    amount: "DOUBLE"
    updated_at: "TIMESTAMP(3)"

dlq_sink:
  class: "flink_framework.sinks.kafka_dlq_sink.KafkaDLQSink"
  topic: "dlq-bad-transactions"
  bootstrap_servers: "localhost:9092"
  schema:
    id: "STRING"
    full_name: "STRING"
    amount: "DOUBLE"
    updated_at: "TIMESTAMP(3)"
